name: Build Tick Recorder APK
on:
  push:
    paths:
      - 'tick-recorder/**'
      - '.github/workflows/tick-recorder-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: tick-recorder
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tick-recorder-debug-apk
          path: tick-recorder/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
